<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooms · JEvents Proposals</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header class="top"><div class="inner"></div></header>
  <main id="page">
    <h1>Rooms and equipment</h1>
    <p class="lead">What the agent reads for Task 3. A capacity of 0 means that layout isn't offered in the room. Every change needs a reason and is recorded with who and when.</p>
    <div id="message"></div>
    <div class="card table-wrap" id="list"><p class="empty">Loading…</p></div>
    <section class="card" id="editor" hidden></section>
    <div class="actions"><button type="button" id="add" class="secondary">Add a room</button></div>
    <section class="card">
      <h2 style="margin-top:0">Change history</h2>
      <div id="history"><p class="empty">Loading…</p></div>
    </section>
  </main>
  <script src="rooms.js"></script>
</body>
</html>
